<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TicTacToe en linea</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/10.0.0/signalr.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; color: #202124; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    input, button { padding: 10px; font-size: 1rem; }
    button { cursor: pointer; }
    #tablero { display: grid; grid-template-columns: repeat(3, 90px); gap: 8px; margin: 20px 0; }
    .casilla { width: 90px; height: 90px; font-size: 2rem; font-weight: bold; }
    #estado { font-weight: bold; min-height: 24px; }
    #historial { padding-left: 20px; }
  </style>
</head>
<body>
  <h1>TicTacToe en linea</h1>
  <p>Usa el mismo identificador de partida en las dos computadoras. Un jugador elige X y el otro O.</p>

  <div class="controls">
    <input id="partidaId" placeholder="Identificador de partida" value="partida-1" maxlength="50">
    <input id="jugador" placeholder="Jugador: X u O" value="X" maxlength="1">
    <button id="conectar">Conectar</button>
  </div>

  <p id="estado">Conectate a una partida para comenzar.</p>
  <div id="tablero" aria-label="Tablero de TicTacToe"></div>
  <button id="reiniciar">Nueva partida</button>

  <h2>Movimientos</h2>
  <ol id="historial"></ol>

  <script>
    const partidaInput = document.getElementById("partidaId");
    const jugadorInput = document.getElementById("jugador");
    const estado = document.getElementById("estado");
    const historial = document.getElementById("historial");
    const tableroElemento = document.getElementById("tablero");
    let conexion = null;
    let partidaActual = null;

    for (let fila = 0; fila < 3; fila++) {
      for (let columna = 0; columna < 3; columna++) {
        const boton = document.createElement("button");
        boton.className = "casilla";
        boton.type = "button";
        boton.setAttribute("aria-label", "Fila " + (fila + 1) + ", columna " + (columna + 1));
        boton.addEventListener("click", () => hacerMovimiento(fila, columna));
        tableroElemento.appendChild(boton);
      }
    }

    document.getElementById("conectar").addEventListener("click", conectar);
    document.getElementById("reiniciar").addEventListener("click", () => {
      estado.textContent = "Para iniciar otra partida, usa un identificador nuevo y conectate de nuevo.";
    });

    async function conectar() {
      const partidaId = partidaInput.value.trim();
      const jugador = jugadorInput.value.trim().toUpperCase();

      if (!partidaId || !["X", "O"].includes(jugador)) {
        estado.textContent = "Escribe un identificador y selecciona X u O.";
        return;
      }

      if (conexion) await conexion.stop();

      jugadorInput.value = jugador;
      conexion = new signalR.HubConnectionBuilder()
        .withUrl("/partidaHub")
        .withAutomaticReconnect()
        .build();

      conexion.on("MovimientoActualizado", pintarPartida);
      conexion.onreconnecting(() => estado.textContent = "Reconectando...");
      conexion.onreconnected(async () => {
        await conexion.invoke("UnirsePartida", partidaId);
        await cargarPartida();
      });

      try {
        await conexion.start();
        await conexion.invoke("UnirsePartida", partidaId);
        await cargarPartida();
        estado.textContent = "Conectado a " + partidaId + ". Eres " + jugador + ".";
      } catch (error) {
        estado.textContent = "No se pudo conectar: " + error.message;
      }
    }

    async function cargarPartida() {
      const respuesta = await fetch("/api/Movimientos/" + encodeURIComponent(partidaInput.value.trim()));
      if (respuesta.status === 404) {
        partidaActual = null;
        pintarVacio();
        estado.textContent = "Partida lista. Empieza el jugador X.";
        return;
      }
      if (!respuesta.ok) throw new Error("No se pudo consultar la partida.");
      pintarPartida(await respuesta.json());
    }

    async function hacerMovimiento(fila, columna) {
      if (!conexion) {
        estado.textContent = "Primero conectate a una partida.";
        return;
      }

      const respuesta = await fetch("/api/Movimientos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          partidaId: partidaInput.value.trim(),
          fila,
          columna,
          jugador: jugadorInput.value.trim().toUpperCase()
        })
      });

      const resultado = await respuesta.json();
      if (!respuesta.ok) {
        estado.textContent = resultado.error || "No se pudo registrar el movimiento.";
        return;
      }
      pintarPartida(resultado);
    }

    function pintarPartida(partida) {
      partidaActual = partida;
      const botones = tableroElemento.querySelectorAll("button");
      partida.tablero.forEach((fila, i) => fila.forEach((valor, j) => {
        const boton = botones[i * 3 + j];
        boton.textContent = valor;
        boton.disabled = Boolean(valor) || Boolean(partida.ganador) || partida.empate;
      }));

      historial.replaceChildren();
      partida.movimientos.forEach(movimiento => {
        const item = document.createElement("li");
        item.textContent = movimiento.simbolo + " jugo en fila " + (movimiento.fila + 1)
          + ", columna " + (movimiento.columna + 1);
        historial.appendChild(item);
      });

      if (partida.ganador) estado.textContent = "Gano " + partida.ganador + ".";
      else if (partida.empate) estado.textContent = "La partida termino en empate.";
      else estado.textContent = "Turno de " + partida.jugadorActual + ".";
    }

    function pintarVacio() {
      partidaActual = null;
      tableroElemento.querySelectorAll("button").forEach(boton => {
        boton.textContent = "";
        boton.disabled = false;
      });
      historial.replaceChildren();
    }
  </script>
</body>
</html>
